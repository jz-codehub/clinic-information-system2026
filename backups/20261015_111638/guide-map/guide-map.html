<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .gm-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
    .gm-side .card-head { padding: 14px 16px; }
    .gm-side .card-body { padding: 14px 16px; }
    .gm-search-row { position: relative; }

    .gm-search-row .s-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .5; font-size: 14px; }

    .gm-room-list { display: flex; flex-direction: column; gap: 7px; max-height: 430px; overflow-y: auto; margin-top: 12px; }
    .gm-room-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border, #e2e8f0); border-radius: 10px; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
    .gm-room-item:hover { border-color: #94a3b8; background: #f8fafc; }
    .gm-room-item.active { border-color: #0f766e; background: #f0fdfa; }
    .gm-room-item .r-ico { font-size: 16px; width: 24px; height: 24px; display: grid; place-items: center; background: #f1f5f9; border-radius: 6px; flex-shrink: 0; }
    .gm-room-item .r-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .gm-room-item .r-cat { font-size: 11px; color: var(--text-light, #94a3b8); }

    .gm-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .gm-toolbar .spacer { flex: 1; }
    .chip-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--border, #e2e8f0); background: #fff; color: #334155; cursor: pointer; transition: .15s; }
    .chip-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .chip-btn.on { background: #0f766e; border-color: #0f766e; color: #fff; }

    .gm-map-card .card-body { padding: 14px; }
    .gm-holder { position: relative; border: 1px solid var(--border, #e2e8f0); border-radius: 12px; overflow: auto; background: #fff; max-height: 72vh; }
    .gm-holder svg { display: block; width: 100%; height: auto; transform-origin: 0 0; }
    .gm-map-card.gm-fullscreen { position: fixed; inset: 0; z-index: 9999; margin: 0; border-radius: 0; padding: 14px; background: #fff; overflow: auto; }
    .gm-map-card.gm-fullscreen .gm-holder { max-height: calc(100vh - 210px); }
    .gm-hint { font-size: 12px; color: var(--text-light, #94a3b8); margin-top: 10px; }
    .zoom-grp { display: inline-flex; align-items: center; gap: 4px; }

    #zoomLbl { font-size: 12px; font-weight: 700; color: #0f766e; min-width: 44px; text-align: center; }
    .st-label { font-size: 12.5px; font-weight: 600; color: #334155; display: inline-flex; align-items: center; gap: 6px; }
    .st-label select { font-size: 12.5px; padding: 7px 9px; border: 1px solid var(--border,#e2e8f0); border-radius: 9px; background: #fff; font-weight: 600; color: #334155; }
    .gm-subtoolbar select { font-size: 12px; padding: 6px 7px; border: 1px solid var(--border,#e2e8f0); border-radius: 8px; background: #fff; font-weight: 600; }
    .way-pt { fill: #f59e0b; stroke: #fff; stroke-width: 2; cursor: grab; }
    .way-num { font: 700 9px system-ui, sans-serif; fill: #7c2d12; text-anchor: middle; pointer-events: none; }
    .way-line { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 7 5; opacity: .9; }
    .chair-g { cursor: grab; }
    .chair-g text { font-size: 17px; text-anchor: middle; pointer-events: none; }
    .chair-g.sel circle { stroke: #0f766e; stroke-width: 2.5; }
    .col-div { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .col-tag { font: 700 8px system-ui, sans-serif; fill: #475569; text-anchor: middle; pointer-events: none; }
    .ent-flag { cursor: pointer; }
    .ent-flag .cap { font: 700 8.5px system-ui, sans-serif; fill: #0f766e; text-anchor: middle; letter-spacing: .4px; pointer-events: none; }
    .way-num { font: 700 9px system-ui, sans-serif; fill: #7c2d12; text-anchor: middle; pointer-events: none; }
    .way-line { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 7 5; opacity: .9; }
    .chair-g { cursor: grab; }
    .chair-g text { font-size: 17px; text-anchor: middle; pointer-events: none; }
    .chair-g.sel circle { stroke: #0f766e; stroke-width: 2.5; }
    .col-div { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .col-tag { font: 700 8px system-ui, sans-serif; fill: #475569; text-anchor: middle; pointer-events: none; }
    .ent-flag { cursor: pointer; }
    .ent-flag .cap { font: 700 8.5px system-ui, sans-serif; fill: #0f766e; text-anchor: middle; letter-spacing: .4px; pointer-events: none; }
    .chair-g .chair-lbl { font-size: 8px; font-weight: 700; fill: #64748b; text-anchor: middle; pointer-events: none; }
    .cell-tag { font: 700 8px system-ui, sans-serif; fill: #475569; text-anchor: middle; pointer-events: none; }
    .cell-tag .cell-no { fill: #0f766e; font-weight: 800; font-size: 8.5px; }
    .door-ico { cursor: pointer; }
    .door-ico-bg { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
    .door-ico-t { font: 700 9px system-ui, sans-serif; text-anchor: middle; pointer-events: none; }
    .door-handle { cursor: grab; }
    .door-handle-bg { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; }
    .door-handle-t { font: 700 10px system-ui, sans-serif; text-anchor: middle; pointer-events: none; }
    .wl { fill: none; stroke: #101418; stroke-width: 5; stroke-linecap: round; pointer-events: none; }
    .wl.sel { stroke: #f97316; }
    .wl.prev { stroke: #f59e0b; stroke-dasharray: 6 5; opacity: .8; }
    .wl-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
    .gm-holder.draw { cursor: crosshair; }
    .route-box { margin-top: 10px; padding: 10px 14px; border: 1px solid #fed7aa; background: #fff7ed; border-radius: 10px; font-size: 13px; color: #9a3412; }

    /* ---- CAD floor-plan drawing (white sheet, black walls) ---- */
    .sheet { fill: #ffffff; }
    .wall { fill: none; stroke: #101418; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .room { fill: #ffffff; stroke: #101418; stroke-width: 2.6; stroke-linejoin: round; transition: fill .15s; cursor: pointer; }
    .room:hover { fill: #eef7f6; }
    .room.hl { fill: #14b8a6; stroke: #0f766e; }
    .room.start-r { stroke: #0d9488; }

    .room-label { font: 700 11px/1.05 system-ui, sans-serif; fill: #101418; text-anchor: middle; pointer-events: none; letter-spacing: .2px; }
    .room-label .sub { font-weight: 500; font-size: 8.5px; fill: #64748b; }
    .door { fill: none; stroke: #101418; stroke-width: 1.4; }
    .fix { fill: none; stroke: #101418; stroke-width: 1.2; }
    .corridor-tag { font: 600 10px system-ui, sans-serif; fill: #94a3b8; letter-spacing: 3px; text-anchor: middle; pointer-events: none; }
    .ground-cap { font: 700 13px system-ui, sans-serif; fill: #101418; letter-spacing: 1px; }
    /* ---- route + draggable markers ---- */
    .route-line { fill: none; stroke: #f97316; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 2 9; }
    .route-len { font: 700 11px system-ui, sans-serif; fill: #9a3412; }
    .marker { cursor: grab; }
    .marker.dragging { cursor: grabbing; }
    .marker .mbody { stroke: #ffffff; stroke-width: 3; }
    .marker .mtext { font: 800 13px system-ui, sans-serif; fill: #ffffff; text-anchor: middle; pointer-events: none; }

    /* ---- interactive layout editor (drag/resize/draw walls) ---- */
    .gm-subtoolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px;
      padding: 9px 10px; border: 1px dashed #94a3b8; border-radius: 10px; background: #f8fafc; }
    .gm-holder.draw { cursor: crosshair; }
    rect.rh { fill: #ffffff; stroke: #0d9488; stroke-width: 2; cursor: nwse-resize; }
    .wl { fill: none; stroke: #1e293b; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; cursor: pointer; }
    .wl.sel { stroke: #0d9488; }
    .wl.prev { stroke: #94a3b8; stroke-dasharray: 6 4; pointer-events: none; }
    circle.wp { fill: #ffffff; stroke: #0d9488; stroke-width: 2.5; cursor: grab; }
    .room-label .rno { font-weight: 800; font-size: 10.5px; fill: #0f766e; }

    /* ---- legend + empty state ---- */
    .gm-legend { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: #475569; }
    .gm-legend span { display: flex; align-items: center; gap: 8px; }
    .lg-box { width: 16px; height: 16px; border: 2px solid #101418; border-radius: 4px; background: #fff; flex-shrink: 0; }
    .lg-box.lg-dest { background: #14b8a6; border-color: #0f766e; }
    .lg-box.lg-corr { background: #f1f5f9; }
    .gm-empty { font-size: 13px; color: #94a3b8; text-align: center; padding: 16px 0; }

    /* ---- admin access list ---- */
    .acc-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; }
    .acc-row:last-child { border-bottom: 0; }
    .acc-badge { font-size: 11px; font-weight: 700; color: #0f766e; background: #ccfbf1; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .acc-badge.no { color: #64748b; background: #f1f5f9; }
    .a-meta { flex: 1; min-width: 0; }
    .a-name { font-size: 13px; font-weight: 600; }
    .a-sub { font-size: 11px; color: #94a3b8; }
  </style>
</head>

  <script>
  /* Floor plan — stylized REPRODUCTION of assets/images/guide.jpg (viewBox 1200x820).
     Coordinates are plain numbers so geometry is easy to nudge closer to the photo. */
  const VB_W = 1200, VB_H = 820;

  const DEPTS = [
    { id:"opd1",   name:"Consultation Room 1", no:"RM 101", icon:"🩺", cat:"Outpatient",     x:310,  y:190, w:160, h:80,  door:"R" },
    { id:"opd2",   name:"Consultation Room 2", no:"RM 102", icon:"🩺", cat:"Outpatient",     x:480,  y:175, w:160, h:95,  door:"R" },
    { id:"treat",  name:"Treatment Room",      no:"RM 103", icon:"🩹", cat:"Outpatient",     x:375,  y:285, w:130, h:150, door:"R" },
    { id:"immun",  name:"Immunization Room",   no:"RM 104", icon:"💉", cat:"Outpatient",     x:520,  y:285, w:120, h:150, door:"R" },
    { id:"vitals", name:"Vital Signs",         no:"RM 105", icon:"💓", cat:"Outpatient",     x:310,  y:450, w:175, h:110, door:"R" },
    { id:"cashier",name:"Cashier",             no:"RM 106", icon:"💰", cat:"Billing",        x:495,  y:450, w:145, h:110, door:"R" },
    { id:"admit",  name:"Admitting",           no:"RM 107", icon:"🛏️", cat:"Admissions",     x:310,  y:575, w:175, h:110, door:"R" },
    { id:"records",name:"Records",             no:"RM 108", icon:"🗂️", cat:"Administrative", x:495,  y:575, w:145, h:110, door:"R" },
    { id:"lobby",  name:"Lobby",               no:"",       icon:"🪑", cat:"Common",         x:652,  y:95,  w:76,  h:80,  door:null },
    { id:"exit",   name:"Main Entrance",       no:"",       icon:"🚪", cat:"Common",         x:652,  y:700, w:76,  h:40,  door:null },
    { id:"lab",    name:"Laboratory",          no:"RM 109", icon:"🔬", cat:"Laboratory",     x:745,  y:155, w:135, h:120, door:"L" },
    { id:"xray",   name:"X-Ray",               no:"RM 110", icon:"🩻", cat:"Imaging",        x:895,  y:155, w:115, h:120, door:"L" },
    { id:"cr",     name:"Comfort Room",        no:"RM 111", icon:"🚻", cat:"Facilities",     x:745,  y:295, w:305, h:85,  door:"L" },

    { id:"waiting",name:"Waiting Area",        no:"RM 113", icon:"🪑", cat:"Common",         x:745,  y:490, w:305, h:95,  door:"L" },
    { id:"pharmacy",name:"Pharmacy",           no:"RM 114", icon:"💊", cat:"Pharmacy",       x:745,  y:605, w:130, h:80,  door:"L" },
    { id:"er1",    name:"Emergency Room 1",    no:"RM 115", icon:"🚑", cat:"Emergency",      x:890,  y:595, w:160, h:38,  door:"L" },
    { id:"er2",    name:"Emergency Room 2",    no:"RM 116", icon:"🚑", cat:"Emergency",      x:890,  y:633, w:160, h:38,  door:"L" },
    { id:"er3",    name:"Emergency Room 3",    no:"RM 117", icon:"🚑", cat:"Emergency",      x:890,  y:671, w:160, h:44,  door:"L" }
  ];
  const allRooms = () => { const del = new Set(LAYOUT.deleted()); return DEPTS.filter((d) => !del.has(d.id)).concat(LAYOUT.boxes()); };
  const deptById = (id) => allRooms().find((d) => d.id === id);
  const isBox = (id) => LAYOUT.boxes().some((b) => b.id === id);

  /* ------------------ GUIDE MAP STORE (admin rename + access) ------------------ */
  const _clone = (o) => JSON.parse(JSON.stringify(o));
  /* Baked-in DEFAULT guide map = the admin's saved layout + room renames.
     Used whenever a browser has nothing stored yet, so the edited map is the
     default on every fresh device / after clearing cache. */
  const DEFAULT_GMAP = {
    names: {
      vitals:"Radiology", admit:"Emergency Room (ER)", records:"Triange",
      cashier:"Laboratory", bxmv8y7l3u:"Yakap", immun:"Optha", opd1:"Comfort Room (CR)",
      lab:"ENT Clinic", cr:"Clinic", dial:"Clinic", bxmv8y8zll:"Clinic",
      bxmv8y827u:"Information", bxmv8y8tjt:"Admitting Section",
      waiting:"Medical Records, HMO, Billing, Accounting"
    },
    editors: [],
    nos: {
      vitals:"", admit:"", records:"", cashier:"", bxmv8y7l3u:"", immun:"", opd1:"",
      lab:"", cr:"RM 111", dial:"RM 112", bxmv8y8zll:"", bxmv8y827u:"", bxmv8y8tjt:"", waiting:"RM 113"
    }
  };
  const GMAP_KEY = "rmc_guidemap_v1";
  const GMAP = {
    load() { const d = read(GMAP_KEY, null); return (d && typeof d === "object") ? d : _clone(DEFAULT_GMAP); },
    save(d) { store(GMAP_KEY, d); },
    names() { const n = this.load().names; return (n && typeof n === "object") ? n : {}; },
    editors() { const e = this.load().editors; return Array.isArray(e) ? e : []; },
    rename(id, name) { const d = this.load(); d.names = d.names || {}; d.names[id] = name; this.save(d); },
    nos() { const n = this.load().nos; return (n && typeof n === "object") ? n : {}; },
    setNo(id, no) { const d = this.load(); d.nos = d.nos || {}; d.nos[id] = no; this.save(d); },
    reset() { this.save({ names:{}, nos:{}, editors: this.editors() }); },
    setEditor(role, on) { const d = this.load(); const s = new Set(this.editors()); if (on) s.add(role); else s.delete(role); d.editors = [...s]; d.names = d.names || {}; this.save(d); },
    canEdit() {
      const s = DB.session();
      if (!s) return false;
      if (s.role === "superadmin") return true;
      return this.editors().includes(s.role);
    }
  };
  const deptName = (d) => (GMAP.names()[d.id] || d.name);
  // Effective room number: admin override if present (even blank), else the default.
  const roomNo = (d) => (d.id in GMAP.nos()) ? GMAP.nos()[d.id] : (d.no || "");
  /* ================= SVG HELPERS ================= */
  const NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  const pt = (x, y) => x.toFixed(1) + "," + y.toFixed(1);

  /* ================= LAYOUT STORE (editable geometry) =================
     Admin drag/resize/draw overrides live here, persisted separately from
     GMAP names so geometry reset never wipes renames. */
  const ENTRANCES = [
    { id:"__south", name:"Patient Entrance (South)", short:"South Entrance", icon:"\u{1F6B6}", dot:{ x:696, y:786 } },
    { id:"__north", name:"Main Entrance (North)", short:"North Entrance", icon:"\u{1F6AA}", dot:{ x:697, y:48 } }
  ];
  const entranceById = (id) => ENTRANCES.find((e) => e.id === id) || ENTRANCES[0];
  /* Baked-in DEFAULT geometry = the admin's saved drag/resize/boxes/doors.
     Falls back to this on a fresh load (nothing stored). */
  const DEFAULT_LAYOUT = {
    rooms: {
      pharmacy:{x:745,y:640,w:135,h:95}, records:{x:490,y:615,w:145,h:120},
      admit:{x:310,y:575,w:130,h:165}, vitals:{x:310,y:270,w:130,h:305},
      immun:{x:555,y:270,w:85,h:170}, bxmv8y7l3u:{x:490,y:295,w:65,h:145},
      cashier:{x:485,y:475,w:110,h:140}, bxmv8y827u:{x:595,y:525,w:40,h:90},
      waiting:{x:835,y:510,w:215,h:95}, bxmv8y8tjt:{x:745,y:510,w:95,h:95},
      bxmv8y8zll:{x:880,y:645,w:165,h:90}, lab:{x:745,y:155,w:305,h:90},
      cr:{x:745,y:245,w:305,h:55}, dial:{x:745,y:345,w:305,h:60},
      bxmv8yb5o0:{x:985,y:405,w:65,h:100}, bxmv8ybfc0:{x:855,y:410,w:140,h:70},
      opd2:{x:470,y:175,w:180,h:40}, bxmv8ygana:{x:475,y:170,w:165,h:55}
    },
    walls: [],
    cols: { dial:3, cr:3, bxmv8y8zll:3 },
    rows: {},
    boxes: [
      {id:"bxmv8y7l3u",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"},
      {id:"bxmv8y827u",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"},
      {id:"bxmv8y8tjt",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"},
      {id:"bxmv8y8zll",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"},
      {id:"bxmv8yb5o0",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"},
      {id:"bxmv8ygana",name:"New Room",no:"",icon:"🚪",cat:"Custom",x:625,y:480,w:140,h:70,door:"L"}
    ],
    ways: [],
    chairs: [ {x:750,y:425,rows:5}, {x:860,y:425,rows:5} ],
    colNames: { cr:{}, dial:{}, bxmv8y8zll:{}, waiting:{} },
    colNos: { cr:{}, dial:{}, bxmv8y8zll:{}, waiting:{} },
    doors: {
      cashier:{edge:"T",t:0.5150304241213327}, bxmv8y827u:{edge:"R",t:0.5895307784656072},
      records:{edge:"L",t:0.8135160089220511}, vitals:{edge:"R",t:0.47470769327556905},
      bxmv8y8zll:{edge:"T",t:0.43544334453425343}, waiting:{edge:"T",t:0.40408428780521805},
      bxmv8y8tjt:{edge:"T",t:0.46117040853882946}, dial:{edge:"T",t:0.48559637084227264},
      cr:{edge:"B",t:0.4816658751084981}
    },
    deleted: ["er1","er2","er3","treat","xray","opd2"]
  };
  const LAYOUT_KEY = "rmc_guidemap_layout_v1";
  const LAYOUT = {
    load() {
      const d = read(LAYOUT_KEY, null);
      const src = (d && typeof d === "object") ? d : _clone(DEFAULT_LAYOUT);
      return {
        rooms:(src.rooms && typeof src.rooms === "object") ? src.rooms : {},
        walls:Array.isArray(src.walls) ? src.walls : [],
        cols:(src.cols && typeof src.cols === "object") ? src.cols : {},
        rows:(src.rows && typeof src.rows === "object") ? src.rows : {},
        boxes:Array.isArray(src.boxes) ? src.boxes : [],
        ways:Array.isArray(src.ways) ? src.ways : [],
        chairs:Array.isArray(src.chairs) ? src.chairs : [],
        colNames:(src.colNames && typeof src.colNames === "object") ? src.colNames : {},
        colNos:(src.colNos && typeof src.colNos === "object") ? src.colNos : {},
        doors:(src.doors && typeof src.doors === "object") ? src.doors : {},
        deleted:Array.isArray(src.deleted) ? src.deleted : []
      };
    },
    save(d) { store(LAYOUT_KEY, d); },
    rooms() { const r = this.load().rooms; return (r && typeof r === "object") ? r : {}; },
    walls() { const w = this.load().walls; return Array.isArray(w) ? w : []; },
    setRoom(id, g) { const d = this.load(); d.rooms = d.rooms || {}; d.rooms[id] = { x:Math.round(g.x), y:Math.round(g.y), w:Math.round(g.w), h:Math.round(g.h) }; this.save(d); },
    clearRoom(id) { const d = this.load(); if (d.rooms) delete d.rooms[id]; this.save(d); },
    addWall(wseg) { const d = this.load(); d.walls = d.walls || []; d.walls.push({ x1:Math.round(wseg.x1), y1:Math.round(wseg.y1), x2:Math.round(wseg.x2), y2:Math.round(wseg.y2) }); this.save(d); },

    const sheet = svgEl("rect", { x:0, y:0, width:VB_W, height:VB_H, class:"sheet" }, root);
    sheet.addEventListener("click", (e) => { e.stopPropagation(); if (editOn && !drawWallMode) { selId = null; selWall = -1; selWay = -1; selChair = -1; drawMap(); syncCols(); } });

    // central corridor band
    svgEl("rect", { x:CORR.x1, y:200, width:(CORR.x2 - CORR.x1), height:538, fill:"#f1f5f9" }, root);
    const ctag = svgEl("text", { x:(CORR.x1 + CORR.x2) / 2, y:520, class:"corridor-tag",
      transform:"rotate(-90 " + ((CORR.x1 + CORR.x2) / 2) + " 520)" }, root);
    ctag.textContent = "CORRIDOR";

    // rooms + door swings + labels (name / room number / category)
    const gR = svgEl("g", {}, root);
    allRooms().forEach((d) => {
      const g = geom(d);
      const cls = "room" + (d.id === destId ? " hl" : "") + (d.id === startId ? " start-r" : "") +
        ((!roomMatches(d, query)) ? " muted" : "");
      const r = svgEl("rect", { x:g.x, y:g.y, width:g.w, height:g.h, rx:2, class:cls, "data-id":d.id }, gR);
      r.addEventListener("click", (e) => { e.stopPropagation(); onRoomClick(d.id); });
      renderCols(gR, d, g);
      r.addEventListener("pointerdown", (e) => { if (editOn) beginMove(e, d); });
      const dp = doorPath(d, g);
      if (dp) svgEl("path", { d:dp, class:"door" }, gR);
      const cx = g.x + g.w / 2;
      const rno = roomNo(d);
      const hasGrid = (LAYOUT.cols()[d.id] || 1) > 1 || (LAYOUT.rows()[d.id] || 1) > 1;
      if (hasGrid) {
        // Room name sits at the top (wrapped + shrunk to fit); each grid cell shows its number + name.
        const fit = fitName(shortName(d), Math.max(14, g.w - 8), 10);
        const t = svgEl("text", { x:cx, y:(g.y + fit.fs + 3).toFixed(1), class:"room-label" }, gR);
        let first = true;
        fit.lines.forEach((ln) => {
          const s = svgEl("tspan", { x:cx, dy: first ? "0" : fit.lh.toFixed(1), class:"" }, t);
          s.setAttribute("style", "font-size:" + fit.fs.toFixed(1) + "px");
          s.textContent = ln;
          first = false;
        });
      } else {
        // Centred block: wrapped name (shrink-to-fit) + room number + category.
        const baseFs = g.h >= 64 ? 11.5 : g.h >= 40 ? 11 : g.h >= 28 ? 10 : 9;
        const fit = fitName(shortName(d), Math.max(14, g.w - 8), baseFs);
        const rows = [];
        fit.lines.forEach((ln) => rows.push({ txt: ln, fs: fit.fs, cls: "" }));
        if (rno) rows.push({ txt: rno, fs: Math.max(7, fit.fs - 1.5), cls: "rno" });
        if (d.cat && g.h >= 40) rows.push({ txt: d.cat, fs: Math.max(7, fit.fs - 3), cls: "sub" });
        const heights = rows.map((r) => r.fs + 1.5);
        const blockH = heights.reduce((a, b) => a + b, 0);
        const scale = (blockH > g.h - 3) ? Math.max(0.55, (g.h - 3) / blockH) : 1;
        const startY = g.y + g.h / 2 - (blockH * scale) / 2 + rows[0].fs * scale * 0.85;
        const t = svgEl("text", { x:cx, y:startY.toFixed(1), class:"room-label" }, gR);
        let first = true;
        rows.forEach((r, i) => {
          const s = svgEl("tspan", { x:cx, dy: first ? "0" : (heights[i] * scale).toFixed(1), class: r.cls }, t);
          s.setAttribute("style", "font-size:" + (r.fs * scale).toFixed(1) + "px");
          s.textContent = r.txt;
          first = false;
        });
      }
    });
    // thick structural walls (base) + admin-drawn walls
    const gW = svgEl("g", {}, root);
    WALLS_BASE.forEach((dstr) => svgEl("path", { d:dstr, class:"wall" }, gW));
    LAYOUT.walls().forEach((wseg, i) => {
      const dstr = "M" + pt(wseg.x1, wseg.y1) + " L" + pt(wseg.x2, wseg.y2);
      const hit = svgEl("path", { d:dstr, class:"wl-hit", "data-w":i }, gW);
      hit.addEventListener("click", (e) => { e.stopPropagation(); if (editOn && !drawWallMode) { selWall = i; selId = null; selWay = -1; selChair = -1; drawMap(); } });
      svgEl("path", { d:dstr, class:("wl" + (i === selWall ? " sel" : "")) }, gW);
      if (editOn && i === selWall) {
        [["a", wseg.x1, wseg.y1], ["b", wseg.x2, wseg.y2]].forEach((ep) => {
          const c = svgEl("circle", { cx:ep[1], cy:ep[2], r:8, class:"way-pt" }, gW);
          c.addEventListener("pointerdown", (e) => { e.stopPropagation(); beginWallEndDrag(e, ep[0]); });
        });
      }
    });
    
    if (drawPreview) svgEl("path", { d:drawPreview, class:"wl prev" }, gW);

    // entrance double doors (top tower + bottom)
    const dd = (cx, y, wdt) => {
      const gg = svgEl("g", {}, root);
      svgEl("path", { d:"M" + pt(cx - wdt/2, y) + " A" + wdt/2 + "," + wdt/2 + " 0 0 1 " + pt(cx, y), class:"door" }, gg);
      svgEl("path", { d:"M" + pt(cx + wdt/2, y) + " A" + wdt/2 + "," + wdt/2 + " 0 0 0 " + pt(cx, y), class:"door" }, gg);
    };
    dd(697, 95, 22);
    dd(696, 738, 64);

    const cap = svgEl("text", { x:300, y:792, class:"ground-cap" }, root);
    cap.textContent = "GROUND FLOOR";

    // entrance flags (tap to set patient start)
    ENTRANCES.forEach((en) => {
      const fg = svgEl("g", { class:"ent-flag", transform:"translate(" + en.dot.x + "," + en.dot.y + ")" }, root);
      svgEl("circle", { r:11, fill:(en.id === startId ? "#0d9488" : "#fff"), stroke:"#0d9488", "stroke-width":2.5 }, fg);
      const ft = svgEl("text", { y:4, class:"mtext", fill:(en.id === startId ? "#fff" : "#0d9488") }, fg);
      ft.textContent = "S";
      const fc = svgEl("text", { y:26, class:"cap" }, fg);
      fc.textContent = en.short.toUpperCase();
      fg.addEventListener("click", (e) => { e.stopPropagation(); startId = en.id; selId = null; drawMap(); showDirections(); syncChrome(); });
    });
    // route + markers
    if (destId && deptById(destId)) {
      const rt = routeTo(destId);
      svgEl("path", { d:rt.path, class:"route-line" }, root);
      const dg = geom(deptById(destId));
      const rl = svgEl("text", { x:dg.x + dg.w / 2, y:dg.y - 8, class:"route-len" }, root);
      rl.textContent = "≈ " + rt.meters + " m";
      makeMarker(root, startId, "S", "#0d9488");
      makeMarker(root, destId, "D", "#f97316");
    }
    // manual route waypoints (draggable) — shown in edit mode
    if (editOn) LAYOUT.ways().forEach((w, i) => {
      const c = svgEl("circle", { cx:w.x, cy:w.y, r:8, class:"way-pt" }, root);
      c.addEventListener("pointerdown", (e) => { e.stopPropagation(); beginWayDrag(e, i); });
      const n = svgEl("text", { x:w.x, y:w.y + 3, class:"way-num" }, root);
      n.textContent = (i + 1);
    });
    // edit handles for selected room + wall endpoints
    if (editOn && selId && deptById(selId)) renderHandles(root, deptById(selId));
    // doors — edit mode: draggable handle; patient view: tap-to-route icon.
    // Either way the guided arrow ends AT the door (never crosses a wall).
    allRooms().forEach((d) => {
      const g = geom(d);
      const dp = doorPoint(d, g);
      if (!dp) return;
      if (editOn) {
        const dg = svgEl("g", { class:"door-handle", "data-id":d.id, transform:"translate(" + dp.x + "," + dp.y + ")" }, root);
        svgEl("circle", { r:9, class:"door-handle-bg" }, dg);
        const dt = svgEl("text", { y:3, class:"door-handle-t" }, dg);
        dt.textContent = "🚪";
        dg.addEventListener("pointerdown", (e) => beginDoorDrag(e, d));
      } else if (d.id !== destId) {
        const dg = svgEl("g", { class:"door-ico", "data-id":d.id, transform:"translate(" + dp.x + "," + dp.y + ")" }, root);
        svgEl("circle", { r:10, class:"door-ico-bg" }, dg);
        const dt = svgEl("text", { y:3.5, class:"door-ico-t" }, dg);
        dt.textContent = "🚪";
        dg.addEventListener("click", (e) => {
          e.stopPropagation();
          destId = d.id; selId = d.id;
          drawMap(); renderList(); showDirections(); syncChrome();
        });
      }
    });
    LAYOUT.chairs().forEach((ch, i) => renderChair(root, ch, i));
    
  }

  function makeMarker(root, id, label, color) {
    if (isEntrance(id)) return;
    const d = deptById(id); if (!d) return;
    const geo = geom(d);
    const dp = doorPoint(d, geo);
    const c = dp || centerOf(geo);
    const gEl = svgEl("g", { class:"marker", "data-id":id, transform:"translate(" + c.x + "," + c.y + ")" }, root);
    svgEl("circle", { r:13, fill:color, class:"mbody" }, gEl);
    const t = svgEl("text", { y:4.5, class:"mtext" }, gEl);
    t.textContent = label;
    gEl.addEventListener("pointerdown", (e) => { e.stopPropagation(); beginMarkerDrag(e, id, gEl); });
  }
  /* ================= BUILD PAGE ================= */
  function buildPage() {
    const _sess = DB.session();
    const can = !!(_sess && _sess.role === "superadmin"); // edit toolbar: super admin only
    renderLayout({ page:"guide-map.html", title:"Guide Map", content:`
    <div class="gm-wrap">

          <div class="gm-legend" style="margin-top:12px">

      </aside>
      <section class="gm-map-card card">

          <div class="gm-toolbar">

              <select id="startSel" title="Saan manggagaling ang pasyente"></select>
            </span>
            <span class="st-label">End: <b id="destName">—</b></span>
            <button class="chip-btn" id="btnDir">🧭 Directions</button>
            <button class="chip-btn" id="btnClear">✖ Clear</button>
            <span class="spacer"></span>
            <span class="zoom-grp">
              <button class="chip-btn" id="btnZoomOut" title="Zoom out">-</button>
              <span id="zoomLbl">100%</span>
              <button class="chip-btn" id="btnZoomIn" title="Zoom in">+</button>
            </span>
            ${can ? `<button class="chip-btn" id="btnEdit">✏️ Edit layout</button>` : ``}
          </div>
          <div class="gm-subtoolbar" id="gmSub" hidden>
            <span class="st-label">🟠 <button class="chip-btn" id="btnAddWay">Daan (waypoint)</button></span>
            <span class="st-label">🪑 <button class="chip-btn" id="btnAddChair">Upuan</button></span>

            <button class="chip-btn" id="btnDrawLine">📏 Draw line</button>
            <span class="st-label">🧱 Columns
              <select id="colSel" title="Ilang column ang selected room/box">
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
              </select>
            </span>
            <span class="st-label">▤ Rows
              <select id="rowSel" title="Ilang row ang selected room/box">
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
              </select>
            </span>
            <button class="chip-btn" id="btnDelSel">🗑 Delete selected</button>
            <button class="chip-btn" id="btnFull">⛶ Fullscreen</button>
            <button class="chip-btn" id="btnRename">✏️ Rename</button>
            <button class="chip-btn" id="btnResetGeo">↺ Reset geometry</button>
            <button class="chip-btn on" id="btnDone">✔ Done</button>
          </div>
          <div class="gm-holder" id="gmHolder">
            <svg id="gmSvg" viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="Clinic floor plan"></svg>
          </div>
          <div class="gm-hint" id="gmHint">💡 Patient starts at the entrance — click a room and follow the orange arrow. Drag S / D to retarget. Zoom ➕➖ to inspect.</div>
          <div class="route-box" id="gmRoute" hidden></div>
        </div>
      </section>
    </div>
    <div class="modal-backdrop" id="gmModal"><div class="modal" style="max-width:460px">
      <div class="modal-head"><h3 id="gmModalTitle">Rename</h3><button class="modal-close" onclick="App.closeModal('gmModal')">&times;</button></div>
      <div class="modal-body" id="gmModalBody"></div>
      <div class="modal-foot" id="gmModalFoot"></div>
    </div></div>` });

    svg = document.getElementById("gmSvg");
    holder = document.getElementById("gmHolder");
    renderList();
    document.getElementById("gmSearch").addEventListener("input", (e) => { query = e.target.value; renderList(); drawMap(); });
    document.getElementById("btnDir").addEventListener("click", showDirections);
    document.getElementById("btnClear").addEventListener("click", () => { destId = null; selId = null; selWay = -1; selChair = -1; document.getElementById("gmRoute").hidden = true; drawMap(); renderList(); });
    const be = document.getElementById("btnEdit");
    if (be) be.addEventListener("click", toggleEdit);
    syncStartSel(); syncCols(); applyZoom();
    document.getElementById("startSel").addEventListener("change", (e) => { startId = e.target.value; drawMap(); showDirections(); });
    document.getElementById("btnZoomIn").addEventListener("click", () => setZoom(zoom + 0.25));
    document.getElementById("btnZoomOut").addEventListener("click", () => setZoom(zoom - 0.25));
    document.getElementById("colSel").addEventListener("change", (e) => {
      if (!selId || !deptById(selId)) { App.toast("Select a room or box first."); e.target.value = "1"; return; }
      LAYOUT.setCols(selId, parseInt(e.target.value, 10) || 1); drawMap();
      App.toast("Columns set to " + e.target.value + ".");
    });
    document.getElementById("rowSel").addEventListener("change", (e) => {
      if (!selId || !deptById(selId)) { App.toast("Select a room or box first."); e.target.value = "1"; return; }
      LAYOUT.setRows(selId, parseInt(e.target.value, 10) || 1); drawMap();
      App.toast("Rows set to " + e.target.value + ".");
    });
    svg.addEventListener("click", () => { if (!editOn) { selWay = -1; selChair = -1; } });
    drawMap();
  }

  function setZoom(z) { zoom = Math.min(2.5, Math.max(0.5, Math.round(z * 100) / 100)); applyZoom(); }
  function applyZoom() { if (svg) { svg.style.width = Math.round(zoom * 100) + "%"; const l = document.getElementById("zoomLbl"); if (l) l.textContent = Math.round(zoom * 100) + "%"; } }
  function syncStartSel() {
    const s = document.getElementById("startSel"); if (!s) return;
    let h = ENTRANCES.map((e) => "<option value=\"" + e.id + "\">" + e.name + "</option>").join("");
    h += allRooms().map((d) => "<option value=\"" + d.id + "\">" + App.esc(deptName(d)) + (roomNo(d) ? " - " + App.esc(roomNo(d)) : "") + "</option>").join("");
    s.innerHTML = h; s.value = startId;
    const dn = document.getElementById("destName");
    if (dn) dn.textContent = (destId && deptById(destId)) ? deptName(deptById(destId)) : "-";
  }
  function syncChrome() { syncStartSel(); }
  function syncCols() {
    const c = document.getElementById("colSel"); if (c) c.value = String((selId && LAYOUT.cols()[selId]) || 1);
    const r = document.getElementById("rowSel"); if (r) r.value = String((selId && LAYOUT.rows()[selId]) || 1);
    syncStartSel();
  }
  function renderList() {
    const list = document.getElementById("gmList");
    const items = allRooms().filter((d) => roomMatches(d, query));
    document.getElementById("gmCount").textContent = items.length + " of " + allRooms().length + " rooms";
    if (!items.length) { list.innerHTML = `<div class="gm-empty">No rooms match your search.</div>`; return; }
    list.innerHTML = items.map((d) =>
      `<div class="gm-room-item${d.id === destId ? " active" : ""}" data-id="${d.id}">
        <span class="r-ico">${d.icon}</span>
        <span><span class="r-name">${App.esc(deptName(d))}${roomNo(d) ? " · " + App.esc(roomNo(d)) : ""}</span><br/>
        <span class="r-cat">${App.esc(d.cat)}</span></span>
      </div>`).join("");
    list.querySelectorAll(".gm-room-item").forEach((n) =>
      n.addEventListener("click", () => onRoomClick(n.getAttribute("data-id"))));
  }

  function onRoomClick(id) {
    if (editOn) { selId = id; selWay = -1; selChair = -1; drawMap(); syncCols(); return; }
    destId = id; selId = id;
    drawMap(); renderList(); showDirections(); syncChrome();
  }

  function showDirections() {
    const box = document.getElementById("gmRoute");
    if (!destId || !deptById(destId)) { box.hidden = true; return; }
    const dd2 = deptById(destId);
    const rt = routeTo(destId);
    box.hidden = false;
    box.innerHTML = `🧭 From <b>${App.esc(startLabel(startId))}</b> to <b>${App.esc(deptName(dd2))}</b>` +
      `${roomNo(dd2) ? " (" + App.esc(roomNo(dd2)) + ")" : ""} — about <b>${rt.meters} meters</b> along the guided path (routes around walls).`;
  }
  /* ================= EDIT MODE: toggle + rename + access ================= */
  function toggleEdit() {
    editOn = !editOn;
    selWay = -1; selChair = -1; drawWallMode = false;
    const bdl = document.getElementById("btnDrawLine"); if (bdl) bdl.classList.remove("on");
    if (holder) holder.classList.remove("draw");
    document.getElementById("gmSub").hidden = !editOn;
    const be2 = document.getElementById("btnEdit"); if (be2) be2.classList.toggle("on", editOn);
    document.getElementById("gmHint").textContent = editOn
      ? "Edit mode: click a room to select (then Rename / set Columns & Rows). Drag to move, pull a corner to resize. Add Daan waypoints + Upuan benches and drag them. Draw line for walls — click a line to select, drag its dots, or Delete."
      : "Patient starts at the entrance — click a room and follow the orange arrow. Drag S / D to retarget. Zoom +/- to inspect.";
    syncCols();
    drawMap();
  }

  function openRename() {
    if (!selId || !deptById(selId)) { App.toast("⚠️", "Select a room or box on the map first."); return; }
    const d = deptById(selId);
    const nc = LAYOUT.cols()[d.id] || 1;
    const nr = LAYOUT.rows()[d.id] || 1;
    const hasGrid = nc > 1 || nr > 1;
    const names = LAYOUT.colNames()[d.id] || {};
    const nos = LAYOUT.colNos()[d.id] || {};
    let gridHtml = "";
    if (hasGrid) {
      gridHtml = `<div class="divider"></div><div class="text-sm text-muted mb-16"><strong>Grid ${nc} × ${nr}</strong> — set a room number + name for each cell. Leave a number blank for none.</div>`;
      for (let r = 0; r < nr; r++) {
        for (let c = 0; c < nc; c++) {
          const i = r * nc + c;
          gridHtml += `<div class="form-grid" style="margin-bottom:10px;">
            <div class="field"><label>Cell R${r + 1}·C${c + 1} · number</label>
              <input type="text" class="input gmColNo" data-i="${i}" value="${App.esc(nos[i] || "")}" placeholder="optional" maxlength="14" /></div>
            <div class="field"><label>name</label>
              <input type="text" class="input gmColName" data-i="${i}" value="${App.esc(names[i] || "")}" placeholder="e.g. Ward ${i + 1}" maxlength="30" /></div>
          </div>`;
        }
      }
    }
    document.getElementById("gmModalTitle").textContent = isBox(d.id) ? "Edit room box" : "Edit room";
    document.getElementById("gmModalBody").innerHTML = `
      <div class="field"><label>Room name <span class="req">*</span></label>
        <input type="text" class="input" id="gmName" value="${App.esc(deptName(d))}" maxlength="60" /></div>
      <div class="field"><label>Room number <span class="sub">(optional)</span></label>
        <input type="text" class="input" id="gmNo" value="${App.esc(roomNo(d))}" placeholder="e.g. RM 101" maxlength="14" /></div>
      ${gridHtml}
      <p class="sub">Applies to ${App.esc(d.id.toUpperCase())} on this device.</p>`;
    document.getElementById("gmModalFoot").innerHTML = `
      <button class="btn btn-outline" onclick="App.closeModal('gmModal')">Cancel</button>
      <button class="btn btn-primary" id="gmSaveName">Save</button>`;
    App.openModal("gmModal");
    document.getElementById("gmSaveName").addEventListener("click", () => {
      const v = document.getElementById("gmName").value.trim();
      if (!v) { App.toast("⚠️", "Name cannot be empty."); return; }
      GMAP.rename(selId, v);
      GMAP.setNo(selId, document.getElementById("gmNo").value.trim());
      document.querySelectorAll(".gmColName").forEach((inp) =>
        LAYOUT.setColName(selId, parseInt(inp.getAttribute("data-i"), 10), inp.value.trim()));
      document.querySelectorAll(".gmColNo").forEach((inp) =>
        LAYOUT.setColNo(selId, parseInt(inp.getAttribute("data-i"), 10), inp.value.trim()));
      App.closeModal("gmModal");
      App.toast("✅", "Saved.");
      drawMap(); renderList();
    });
  }

  function openAccess() {
    const users = DB.users.all();
    const ed = GMAP.editors();
    const rows = ["doctor", "secretary", "regular"].map((r) => {
      const n = users.filter((u) => u.role === r).length;
      const on = ed.includes(r);
      const lbl = { doctor:"Doctor", secretary:"Secretary", regular:"Regular User" }[r];
      return `<div class="acc-row">
        <span class="acc-badge${on ? "" : " no"}">${on ? "CAN EDIT" : "VIEW ONLY"}</span>
        <span class="a-meta"><span class="a-name">${lbl}s</span><br/>
        <span class="a-sub">${n} account${n === 1 ? "" : "s"}</span></span>
        <button class="chip-btn${on ? " on" : ""}" data-role="${r}">${on ? "On" : "Off"}</button>
      </div>`;
    }).join("");
    document.getElementById("gmModalTitle").textContent = "Layout access";
    document.getElementById("gmModalBody").innerHTML = `
      <p class="sub">Super Admin can always edit. Grant other roles permission to rename rooms and edit geometry.</p>${rows}`;
    document.getElementById("gmModalFoot").innerHTML = `
      <button class="btn btn-outline" onclick="App.closeModal('gmModal')">Close</button>`;
    App.openModal("gmModal");
    document.querySelectorAll("#gmModalBody .chip-btn").forEach((b) =>
      b.addEventListener("click", () => {
        const r = b.getAttribute("data-role");
        GMAP.setEditor(r, !GMAP.editors().includes(r));
        openAccess();
      }));
  }
  /* ================= EDIT MODE: drag / resize / draw / delete (grid snap) ================= */
  function svgPoint(e) {
    const r = svg.getBoundingClientRect();
    return { x:(e.clientX - r.left) * VB_W / r.width, y:(e.clientY - r.top) * VB_H / r.height };
  }

  function renderCols(gR, d, g) {
    const nc = LAYOUT.cols()[d.id] || 1;
    const nr = LAYOUT.rows()[d.id] || 1;
    if (nc <= 1 && nr <= 1) return;
    const names = LAYOUT.colNames()[d.id] || {};
    const nos = LAYOUT.colNos()[d.id] || {};
    for (let i = 1; i < nc; i++) {
      const xx = g.x + g.w * i / nc;
      svgEl("line", { x1:xx, y1:g.y + 4, x2:xx, y2:g.y + g.h - 4, class:"col-div" }, gR);
    }
    for (let j = 1; j < nr; j++) {
      const yy = g.y + g.h * j / nr;
      svgEl("line", { x1:g.x + 4, y1:yy, x2:g.x + g.w - 4, y2:yy, class:"col-div" }, gR);
    }
    for (let r = 0; r < nr; r++) {
      for (let c = 0; c < nc; c++) {
        const idx = r * nc + c;
        const cx = g.x + g.w * (c + 0.5) / nc;
        const cy = g.y + g.h * (r + 0.5) / nr;
        const no = nos[idx] || "";
        const nm = names[idx] || ("C" + (idx + 1));
        const t = svgEl("text", { x:cx, y:cy + 3, class:"cell-tag" }, gR);
        if (no) { const s = svgEl("tspan", { x:cx, dy:"0", class:"cell-no" }, t); s.textContent = no; }
        const s2 = svgEl("tspan", { x:cx, dy: no ? "9" : "0", class:"" }, t); s2.textContent = nm;
      }
    }
  }
  function renderChair(root, ch, i) {
    const n = ch.rows || 5;
    const seatW = 16, gap = 6, totalW = n * seatW + (n - 1) * gap;
    const selected = (i === selChair);
    const cg = svgEl("g", { class:"chair-g" + (selected ? " sel" : ""), transform:"translate(" + ch.x + "," + ch.y + ")" }, root);
    if (selected) svgEl("rect", { x:-8, y:-8, width:totalW + 16, height:56, rx:6, fill:"none", stroke:"#0f766e", "stroke-width":2, "stroke-dasharray":"5 4" }, cg);
    svgEl("rect", { x:0, y:0, width:totalW, height:12, rx:3, fill:"#cbd5e1", stroke:"#64748b", "stroke-width":1 }, cg);
    for (let k = 0; k < n; k++) {
      svgEl("rect", { x:k * (seatW + gap), y:16, width:seatW, height:16, rx:2, fill:"#e2e8f0", stroke:"#64748b", "stroke-width":1 }, cg);
    }
    const t = svgEl("text", { x:totalW / 2, y:44, class:"chair-lbl" }, cg);
    t.textContent = n + " seats";
    cg.addEventListener("pointerdown", (e) => { e.stopPropagation(); beginChairDrag(e, i); });
  }
  function renderHandles(root, d) {
    const g = geom(d);
    svgEl("rect", { x:g.x, y:g.y, width:g.w, height:g.h, fill:"none",
      stroke:"#0d9488", "stroke-width":1.5, "stroke-dasharray":"6 4" }, root);
    [["nw", g.x, g.y], ["ne", g.x + g.w, g.y], ["sw", g.x, g.y + g.h], ["se", g.x + g.w, g.y + g.h]].forEach((h) => {
      const el = svgEl("rect", { x:h[1] - 7, y:h[2] - 7, width:14, height:14, rx:3, class:"rh", "data-c":h[0] }, root);
      el.addEventListener("pointerdown", (e) => { e.stopPropagation(); beginResize(e, d, h[0]); });
    });
  }

  function beginMove(e, d) {
    e.stopPropagation();
    selId = d.id; selWall = -1; selWay = -1; selChair = -1; syncCols();
    const g0 = geom(d), p0 = svgPoint(e);
    let moved = false;
    const mv = (ev) => {
      const p = svgPoint(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true; ev.preventDefault();
      LAYOUT.setRoom(d.id, { x:g0.x + dx, y:g0.y + dy, w:g0.w, h:g0.h });
      drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if (moved) {
        const g = LAYOUT.rooms()[d.id] || g0;
        LAYOUT.setRoom(d.id, { x:snap(g.x), y:snap(g.y), w:g.w, h:g.h });
        drawMap(); App.toast("✅", "Room moved.");
      } else { drawMap(); }
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }

  function beginResize(e, d, corner) {
    e.stopPropagation(); e.preventDefault();
    const g0 = geom(d), p0 = svgPoint(e);
    let moved = false;
    const mv = (ev) => {
      const p = svgPoint(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true;
      let g = { x:g0.x, y:g0.y, w:g0.w, h:g0.h };
      if (corner.includes("e")) g.w = Math.max(24, g0.w + dx);
      if (corner.includes("s")) g.h = Math.max(18, g0.h + dy);
      if (corner.includes("w")) { g.x = g0.x + dx; g.w = Math.max(24, g0.w - dx); }
      if (corner.includes("n")) { g.y = g0.y + dy; g.h = Math.max(18, g0.h - dy); }
      LAYOUT.setRoom(d.id, g);
      drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if (moved) {
        const g = LAYOUT.rooms()[d.id] || g0;
        LAYOUT.setRoom(d.id, { x:snap(g.x), y:snap(g.y), w:Math.max(24, snap(g.w)), h:Math.max(18, snap(g.h)) });
        drawMap(); App.toast("✅", "Room resized.");
      }
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }

  function onSvgDown(e) {
    if (!(editOn && drawWallMode)) return;
    e.preventDefault();
    const p0 = svgPoint(e);
    let p1 = { x:p0.x, y:p0.y };
    const mv = (ev) => {
      p1 = svgPoint(ev);
      drawPreview = "M" + pt(snap(p0.x), snap(p0.y)) + " L" + pt(snap(p1.x), snap(p1.y));
      drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      const a = { x1:snap(p0.x), y1:snap(p0.y), x2:snap(p1.x), y2:snap(p1.y) };
      drawPreview = null;
      if (Math.hypot(a.x2 - a.x1, a.y2 - a.y1) >= 10) { LAYOUT.addWall(a); App.toast("✅", "Wall added."); }
      drawMap();
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }

  function beginWallEndDrag(e, end) {
    e.preventDefault();
    const i = selWall, w0 = Object.assign({}, LAYOUT.walls()[i]), p0 = svgPoint(e);
    let moved = false;
    const mv = (ev) => {
      const p = svgPoint(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true;
      const dd = LAYOUT.load();
      dd.walls[i] = {
        x1:w0.x1 + (end === "a" ? dx : 0), y1:w0.y1 + (end === "a" ? dy : 0),
        x2:w0.x2 + (end === "b" ? dx : 0), y2:w0.y2 + (end === "b" ? dy : 0)
      };
      LAYOUT.save(dd); drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if (moved) {
        const dd = LAYOUT.load(), w = dd.walls[i];
        w.x1 = snap(w.x1); w.y1 = snap(w.y1); w.x2 = snap(w.x2); w.y2 = snap(w.y2);
        LAYOUT.save(dd); drawMap();
      }
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }

  function beginMarkerDrag(e, id, g) {
    e.preventDefault();
    g.classList.add("dragging");
    const isStart = (id === startId);
    const mv = (ev) => {
      const p = svgPoint(ev);
      g.setAttribute("transform", "translate(" + p.x + "," + p.y + ")");
    };
    const up = (ev) => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      g.classList.remove("dragging");
      const p = svgPoint(ev);
      const hit = allRooms().find((d) => {
        const gg = geom(d);
        return p.x >= gg.x && p.x <= gg.x + gg.w && p.y >= gg.y && p.y <= gg.y + gg.h;
      });
      if (hit) { if (isStart) startId = hit.id; else destId = hit.id; selId = hit.id; }
      drawMap(); renderList(); showDirections(); syncChrome(); syncCols();
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }
  // Drag a room's door icon to reposition it along any of the room's edges.
  function beginDoorDrag(e, d) {
    e.stopPropagation(); e.preventDefault();
    selId = d.id; selWall = -1; selWay = -1; selChair = -1;
    const g0 = geom(d);
    let moved = false;
    const mv = (ev) => {
      const p = svgPoint(ev);
      const upd = doorFromPoint(d, g0, p);
      LAYOUT.setDoor(d.id, upd.edge, upd.t);
      moved = true;
      drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if (moved) App.toast("🚪", "Door moved. Route now ends here.");
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }
  function beginWayDrag(e, i) {
    e.stopPropagation(); e.preventDefault();
    selWay = i; selChair = -1; selId = null;
    const arr = LAYOUT.ways(); if (!arr[i]) return;
    const w0 = { x:arr[i].x, y:arr[i].y }, p0 = svgPoint(e);
    const mv = (ev) => { const p = svgPoint(ev); arr[i] = { x:snap(w0.x + p.x - p0.x), y:snap(w0.y + p.y - p0.y) }; LAYOUT.setWays(arr); drawMap(); };
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  }
  function beginChairDrag(e, i) {
    e.stopPropagation();
    selChair = i; selId = null; selWay = -1; selWall = -1;
    const arr = LAYOUT.chairs(); if (!arr[i]) return;
    const c0 = { x:arr[i].x, y:arr[i].y }, p0 = svgPoint(e);
    let moved = false;
    const mv = (ev) => {
      const p = svgPoint(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (!moved && Math.hypot(dx, dy) < 3) return;
      moved = true; ev.preventDefault();
      arr[i] = { x:snap(c0.x + dx), y:snap(c0.y + dy), rows: arr[i].rows || 5 };
      LAYOUT.setChairs(arr); drawMap();
    };
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if (!moved) drawMap();
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }
  function addWay() {
    const arr = LAYOUT.ways().slice();
    const last = arr.length ? arr[arr.length - 1] : { x:CORR_X, y:430 };
    const nx = last.x + 30 > VB_W - 40 ? last.x - 30 : last.x + 30;
    arr.push({ x:snap(nx), y:snap(last.y) });
    LAYOUT.setWays(arr); drawMap();
    App.toast("🟠", "Waypoint added — drag it onto the route.");
  }
  function addChair() {
    const arr = LAYOUT.chairs().slice();
    const last = arr.length ? arr[arr.length - 1] : { x:800, y:520 };
    arr.push({ x:snap(Math.min(last.x, VB_W - 140)), y:snap(last.y), rows: 5 });
    LAYOUT.setChairs(arr); drawMap();
    App.toast("🪑", "Waiting bench added (5 seats) — drag it into place.");
  }
  function addBox() {
    const id = "bx" + Date.now().toString(36);
    LAYOUT.addBox({ id:id, name:"New Room", no:"", icon:"🚪", cat:"Custom", x:snap(CORR_X - 70), y:480, w:140, h:70, door:"L" });
    selId = id; selWay = -1; selChair = -1;
    drawMap(); renderList(); syncCols();
    App.toast("📦", "Room box added — drag to move, set Columns, then Rename.");
  }
  function deleteSelected() {
    if (selChair >= 0 && LAYOUT.chairs()[selChair] !== undefined) {
      const a = LAYOUT.chairs().slice(); a.splice(selChair, 1); LAYOUT.setChairs(a); selChair = -1; drawMap(); App.toast("🗑", "Bench deleted."); return;
    }
    if (selWay >= 0 && LAYOUT.ways()[selWay] !== undefined) {
      const a = LAYOUT.ways().slice(); a.splice(selWay, 1); LAYOUT.setWays(a); selWay = -1; drawMap(); App.toast("🗑", "Waypoint deleted."); return;
    }
    if (selWall >= 0 && LAYOUT.walls()[selWall] !== undefined) {
      LAYOUT.delWall(selWall); selWall = -1; drawMap(); App.toast("🗑", "Line deleted."); return;
    }
    if (selId && isBox(selId)) {
      const a = LAYOUT.boxes().filter((b) => b.id !== selId); LAYOUT.setBoxes(a); selId = null; drawMap(); renderList(); App.toast("🗑", "Room box deleted."); return;
    }
    if (selId && deptById(selId)) {
      LAYOUT.delRoom(selId); selId = null; drawMap(); renderList(); App.toast("🗑", "Room deleted. (Restore via Reset geometry.)"); return;
    }
    App.toast("⚠️", "Click a room, box, bench, waypoint or line first, then Delete.");
  }
  function toggleFull() {
    const card = document.querySelector(".gm-map-card"); if (!card) return;
    card.classList.toggle("gm-fullscreen");
    const on = card.classList.contains("gm-fullscreen");
    const b = document.getElementById("btnFull"); if (b) b.textContent = on ? "🗗 Exit full" : "⛶ Fullscreen";
    document.body.style.overflow = on ? "hidden" : "";
  }
  /* ================= SUBTOOLBAR WIRING + BOOT ================= */
  function wireSub() {
    document.getElementById("btnAddWay").addEventListener("click", addWay);
    document.getElementById("btnAddChair").addEventListener("click", addChair);
    document.getElementById("btnAddBox").addEventListener("click", addBox);
    document.getElementById("btnDelSel").addEventListener("click", deleteSelected);
    document.getElementById("btnFull").addEventListener("click", toggleFull);
    document.getElementById("btnRename").addEventListener("click", openRename);
    const bdl = document.getElementById("btnDrawLine");
    if (bdl) bdl.addEventListener("click", () => {
      drawWallMode = !drawWallMode;
      bdl.classList.toggle("on", drawWallMode);
      holder.classList.toggle("draw", drawWallMode);
      drawMap();
    });
    svg.addEventListener("pointerdown", onSvgDown);
    document.getElementById("btnResetGeo").addEventListener("click", () => {
      if (!confirm("Reset all moved rooms, boxes, waypoints and chairs, and restore deleted rooms? Names are kept.")) return;
      LAYOUT.resetGeo(); selId = null; selWay = -1; selChair = -1; selBox = -1;
      drawMap(); renderList(); syncCols(); App.toast("♻", "Positions reset. Names kept.");
    });
    document.getElementById("btnDone").addEventListener("click", toggleEdit);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.querySelector(".gm-map-card.gm-fullscreen")) toggleFull();
    });
  }

  (function boot() {
    requireAuth();
    buildPage();
    wireSub();
  })();
  </script>
</body>
</html>
